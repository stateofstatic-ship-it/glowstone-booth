<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Unsubscribe | Glowstone</title>
  <style>
    body { margin: 0; padding: 28px 20px; background: #f8faf8; color: #172526; font: 17px/1.6 system-ui, sans-serif; }
    main { max-width: 34rem; margin: 4vh auto; }
    h1 { font-size: 1.65rem; line-height: 1.25; }
    button { padding: 14px 24px; border: 0; border-radius: 8px; background: #24583e; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>Unsubscribe from Glowstone marketing</h1>
    <p>This does not remove your giveaway entry or cancel an unexpired discount code.</p>
    <form id="unsubscribe-form"><button id="unsubscribe-button" type="submit" disabled>Unsubscribe</button></form>
    <p id="status" role="status" aria-live="polite">Checking your link…</p>
    <noscript>Please enable JavaScript to unsubscribe here, or reply to your Glowstone email for help.</noscript>
  </main>
  <script type="module" src="./js/unsubscribe.js"></script>
</body>
</html>
